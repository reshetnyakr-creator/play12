<!doctype html><html lang="ru"><meta charset="utf-8"><title>Play12 Editor browser contracts</title><h1>Browser integration checks</h1><pre id="result">Running…</pre><script src="../editor/core.js"></script><script>
(async()=>{const E=Play12Editor,records=[];const test=async(name,fn)=>{try{await fn();records.push({name,status:'pass'});}catch(e){records.push({name,status:'fail',error:e.message});}};const assert=(v,m)=>{if(!v)throw Error(m||'Assertion failed');};
const xml=`<?xml version="1.0"?><score-partwise version="4.0"><part-list><score-part id="P1"><part-name>Piano</part-name></score-part></part-list><part id="P1"><measure number="0" implicit="yes"><attributes><divisions>3</divisions><time><beats>4</beats><beat-type>4</beat-type></time></attributes><note><pitch><step>C</step><octave>4</octave></pitch><duration>1</duration><voice>1</voice><tie type="start"/><notations><technical><fingering>2</fingering></technical></notations></note><note><chord/><pitch><step>E</step><octave>4</octave></pitch><duration>1</duration><voice>2</voice></note></measure><measure number="1"><attributes><divisions>6</divisions></attributes><note><pitch><step>C</step><octave>4</octave></pitch><duration>2</duration><voice>1</voice><tie type="stop"/></note><backup><duration>2</duration></backup><forward><duration>2</duration></forward><note><rest/><duration>2</duration></note></measure></part></score-partwise>`;
let s;await test('MusicXML exact cursor, chord, pickup, divisions and source fingering',()=>{s=E.importXML(xml,{'P1:1':'R'});const ns=E.events(s);assert(ns.length===3);assert(ns[0].duration_quarters==='1/3');assert(ns[1].editor_onset_q==='0/1');assert(ns[2].editor_onset_q==='1/3');assert(ns[0].source_fingering===2);assert(s.score.parts[0].measures[0].editor_duration_q==='1/3');});
await test('Tie across divisions changes yields single attack/contact',()=>{const cs=E.contacts(s).contacts;assert(cs.length===2);assert(cs[0].ids.length===2);assert(cs[0].end==='2/3');});
await test('Invalid XML and external entity definitions rejected',()=>{for(const raw of ['<score-partwise>','<!DOCTYPE x [<!ENTITY e SYSTEM "file:///etc/passwd">]><score-partwise/>']){let caught=false;try{E.importXML(raw);}catch(e){caught=true;}assert(caught);}});
await test('Standard MusicXML doctype accepted without network entity expansion',()=>{assert(E.events(E.importXML('<!DOCTYPE score-partwise SYSTEM "http://invalid.example/test.dtd">'+xml.replace('<?xml version="1.0"?>',''),{'P1:1':'R'})).length===3);});
await test('Missing hand is diagnostic, never inferred from staff',()=>{const x=E.importXML(xml);assert(E.events(x).every(e=>e.hand===null));assert(x.editor.diagnostics.some(d=>d.code==='HAND_UNKNOWN'));});
await test('IndexedDB document/history roundtrip and revision conflict',async()=>{const cfg=await fetch('../editor/beginner.json').then(r=>r.json()),run=E.propose(s,cfg);const d={schema:'play12-editor-document/1',id:'test-'+crypto.randomUUID(),revision:1,score:s,run,manual:{},history:[],cursor:0,mode:'engine',title:'Browser test'};const t=E.edit(d,'P1.m0.e0',4);E.commit(d,t);await E.Store.put(d);const restored=await E.Store.get(d.id);assert(JSON.stringify(restored)===JSON.stringify(d));assert(restored.manual['P1.m1.e0']===4);let rejected=false;try{await E.Store.put({...d,revision:3},0);}catch(e){rejected=true;}assert(rejected);assert((await E.Store.get(d.id)).revision===2);});
document.getElementById('result').textContent=JSON.stringify({passed:records.filter(x=>x.status==='pass').length,failed:records.filter(x=>x.status==='fail').length,records},null,2);
})();</script></html>
