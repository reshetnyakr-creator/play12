<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Play12 · Атлас физических удержаний</title>
<link rel="stylesheet" href="../../../renderer/play12-renderer.css">
<style>
body{font:16px system-ui;max-width:1100px;margin:20px auto;padding:0 16px;color:#182019}
section{border-top:1px solid #bbb;margin-top:24px;padding-top:8px}label{display:block;margin:10px 0}
.views{display:grid;grid-template-columns:minmax(240px,2fr) minmax(180px,1fr);gap:12px}
figure{margin:0}figcaption{font-weight:600;margin-bottom:6px}img,.play svg{max-width:100%;height:auto}
table{width:100%;border-collapse:collapse;margin:12px 0}td,th{border-bottom:1px solid #ddd;padding:5px;text-align:left}
.lane{position:relative;height:13px;background:#eee;min-width:100px}.hold{position:absolute;height:100%;background:#afbdc3}
.goal .hold{background:#e96e40}.wide .hold{background:#68578a}.goal{font-weight:700}
.play .target>rect:first-of-type{stroke:#db4b18!important;stroke-width:3px}.play .blocker>rect:first-of-type{stroke:#68578a!important;stroke-width:2.5px}
@media(max-width:680px){.views{grid-template-columns:1fr}.scroll{overflow-x:auto}}
</style>
<h1>Stage 3.0.6 · Атлас физических удержаний</h1>
<p>Оранжевый — исследуемая нота, фиолетовый — занятые клавиши вне допустимого диапазона. Полосы отражают физический план Stage 3.0.5. Время отсчитывается в четвертях от начала композиции.</p>
<label>Локальный файл расчёта Stage 3.0.5 <input type="file" id="replay" accept=".json"></label>
<label>Исходные выгрузки Play12 обеих композиций <input type="file" id="imports" accept=".json" multiple></label>
<label>Нотные фрагменты из оригинальных MXL <input type="file" id="engraving" accept=".svg" multiple></label>
<p id="status" role="status"></p>
<main></main>
<script src="../../../editor/core.js"></script>
<script src="../../../renderer/play12-renderer.js"></script>
<script src="atlas.js"></script>
</html>
