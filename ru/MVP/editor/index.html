<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Импорт произведения — Play12</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: "Inter", sans-serif;
  background: #F5F5F5;
  color: #111111;
}

header {
  height: 96px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 58px;
  border-bottom: 1px solid rgba(0, 0, 0, 0.08);
}

.logo-link {
  display: block;
  opacity: 0.75;
  transition: opacity 0.25s ease;
}

.logo-link:hover {
  opacity: 1;
}

.logo-img {
  display: block;
  width: 120px;
  height: auto;
}

nav {
  display: flex;
  align-items: center;
  gap: 44px;
}

nav a {
  position: relative;
  color: #111111;
  text-decoration: none;
  font-size: 18px;
  font-weight: 500;
  padding-bottom: 8px;
}

nav a::after {
  content: "";
  position: absolute;
  left: 0;
  bottom: 0;
  width: 0;
  height: 3px;
  background: #CEF932;
  transition: width 0.25s ease;
}

nav a:hover::after {
  width: 100%;
}

.hero {
  min-height: calc(100vh - 96px);
  display: grid;
  grid-template-columns: 0.9fr 1.1fr;
  align-items: center;
  gap: 44px;
  padding: 70px 58px 80px;
}

.hero-content {
  max-width: 650px;
}

h1 {
  font-size: clamp(62px, 6vw, 96px);
  line-height: 0.96;
  font-weight: 900;
  letter-spacing: -0.06em;
  margin-bottom: 34px;
}

.accent {
  color: #E96E40;
}

.tagline {
  font-size: clamp(24px, 2vw, 34px);
  line-height: 1.2;
  font-weight: 700;
  letter-spacing: -0.04em;
  margin-bottom: 28px;
}

.description {
  max-width: 560px;
  font-size: 22px;
  line-height: 1.5;
  font-weight: 400;
  color: #555555;
  margin-bottom: 42px;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 22px;
}

.buttons .button { min-width: 0; padding-inline: 8px; }
.buttons .button-primary { grid-column: 1 / -1; }

.button {
  min-width: 220px;
  display: inline-flex;
  justify-content: center;
  align-items: center;
  padding: 18px 32px;
  border: 2px solid #CEF932;
  border-radius: 10px;
  color: #111111;
  background: transparent;
  text-decoration: none;
  font-size: 20px;
  font-weight: 700;
  transition: all 0.25s ease;
}

.button:hover {
  background: #E96E40;
  border-color: #E96E40;
  color: #ffffff;
}

.button-primary {
  background: #CEF932;
  border-color: #CEF932;
}

.download-trigger {
  font-family: inherit;
  cursor: pointer;
}

.language-modal {
  width: min(520px, calc(100% - 44px));
  margin: auto;
  padding: 44px;
  border: 2px solid #CEF932;
  border-radius: 10px;
  background: #F5F5F5;
  color: #111111;
}

.language-modal::backdrop {
  background: rgba(17, 17, 17, 0.55);
}

.language-modal-close {
  position: absolute;
  top: 14px;
  right: 18px;
  border: 0;
  background: transparent;
  color: #111111;
  font-family: inherit;
  font-size: 30px;
  line-height: 1;
  cursor: pointer;
}

.language-modal h2 {
  margin-bottom: 30px;
  font-size: 32px;
  line-height: 1.15;
  font-weight: 800;
  letter-spacing: -0.04em;
  text-align: center;
}

.language-options {
  display: flex;
  gap: 18px;
}

.language-options .button {
  min-width: 0;
  flex: 1;
}

.language-modal-close:focus-visible,
.download-trigger:focus-visible,
.language-options .button:focus-visible {
  outline: 3px solid #E96E40;
  outline-offset: 4px;
}

.hero-visual {
  display: flex;
  justify-content: center;
  align-items: center;
}

.keyboard-img {
  width: min(100%, 720px);
  height: auto;
  display: block;
}
.social-footer {
    display: none !important;
}
@media (max-width: 1100px) {
  .buttons { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .buttons .button-primary { grid-column: auto; }
  header {
    padding: 0 28px;
  }

  nav {
    gap: 24px;
  }

  nav a {
    font-size: 16px;
  }

  .hero {
    grid-template-columns: 1fr;
    padding: 56px 28px 70px;
  }

  .hero-content {
    max-width: 760px;
  }

  .hero-visual {
    justify-content: flex-start;
  }

  .keyboard-img {
    width: min(100%, 720px);
  }
}

@media (max-width: 920px) {
  .buttons { grid-template-columns: 1fr; }
  header {
    height: auto;
    padding: 22px 22px;
    align-items: flex-start;
    gap: 22px;
  }

  .logo-img {
    width: 120px;
  }
.hero-visual {
  display: none;
}
.social-footer {
  display: block !important;
} 
  nav {
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 16px 22px;
  }

  nav a {
    font-size: 15px;
  }

  .hero {
    min-height: auto;
    padding: 46px 22px 60px;
  }

  h1 {
    font-size: 52px;
    margin-bottom: 26px;
  }

  .tagline {
    font-size: 24px;
  }

  .description {
    font-size: 18px;
  }

  .button {
    width: 100%;
  }

  .language-modal {
    padding: 42px 22px 28px;
  }

  .language-modal h2 {
    font-size: 27px;
  }

  .language-options {
    flex-direction: column;
  }
}

@media (max-width: 720px) {
  nav a:nth-child(n+3) {
    display: none;
  }

  header {
    height: 92px;
    align-items: center;
  }

  nav {
    gap: 28px;
  }

  .hero {
    padding-top: 56px;
  }
}
.social-footer {
 display: block !important;
  text-align: center;
  padding: 50px 20px;
  border-top: 1px solid rgba(0,0,0,0.08);
}

.social-title {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 12px;
}

.social-links {
  display: flex;
  justify-content: center;
  gap: 32px;
  flex-wrap: wrap;
}

.social-links a {
  color: #111111;
  text-decoration: none;
  font-size: 18px;
  font-weight: 500;
}

.social-links a:hover {
  color: #E96E40;
}  


.language-switch {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  white-space: nowrap;
  font-size: 15px;
  font-weight: 700;
}

.language-switch a {
  display: inline-block !important;
  font-size: 15px;
  font-weight: 700;
  padding-bottom: 4px;
}

.language-switch a::after {
  height: 2px;
}

.language-switch .active-language {
  color: #E96E40;
}
